    <rect x="194" y="252" width="118" height="30" rx="8" fill="#fff" stroke="#CBD5E1"/>
    <rect x="214" y="263" width="78" height="8" rx="4" fill="#64748B" opacity=".5"/>
  </g>

  <!-- Carte calendrier -->
  <g>
    <rect x="250" y="230" width="230" height="200" rx="20" fill="#fff" stroke="#E2E8F0"/>
    <rect x="274" y="254" width="96" height="11" rx="5.5" fill="#172033"/>
